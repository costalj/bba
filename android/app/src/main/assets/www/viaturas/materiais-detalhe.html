<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Materiais da Viatura</title>
  <link rel="stylesheet" href="../css/style.css">
</head>
<body>
  <header class="app-header">
    <div class="header-inner">
      <a href="index.html" class="header-back">←</a>
      <span class="logo"><img src="../img/logo-bba.png" alt="BBA"></span>
      <div class="header-titles"><h1>Materiais da Viatura</h1></div>
    </div>
  </header>
  <main class="container" id="conteudo"></main>
  <nav class="bottom-nav">
    <a href="../index.html" class="nav-item"><span class="nav-icon">🏠</span><span>Início</span></a>
    <a href="materiais-nova.html" class="nav-item"><span class="nav-icon">➕</span><span>Nova</span></a>
    <a href="index.html" class="nav-item active"><span class="nav-icon">📁</span><span>Histórico</span></a>
  </nav>
  <script src="../js/usuarios-seed.js"></script>
  <script src="../js/seed-meta.js"></script>
  <script src="../js/materiais-viatura-dados.js"></script>
  <script src="../js/seed.js"></script>
  <script src="../js/materiais-viatura.js"></script>
  <script src="../js/auth.js"></script>
  <script src="../js/header.js"></script>
  <script>
    if (!exigirLogin()) throw new Error("auth");
    const id = new URLSearchParams(location.search).get("id");
    const item = obterConferenciaMateriais(id);
    const el = document.getElementById("conteudo");
    el.innerHTML = item
      ? htmlDetalheMaterial(item)
      : `<div class="empty-state"><p>Conferência não encontrada.</p><a href="index.html" class="btn btn-primary">Voltar</a></div>`;
  </script>
</body>
</html>
