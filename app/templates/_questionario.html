{% macro sim_nao(pergunta) %}
<div class="pergunta-card">
  <div class="pergunta-header">
    <span class="pergunta-numero">{{ pergunta.numero }}</span>
    <p class="pergunta-texto">{{ pergunta.texto }}</p>
    {% if pergunta.get('alerta') %}
    <small class="pergunta-alerta">⚠️ {{ pergunta.alerta }}</small>
    {% endif %}
    {% if pergunta.get('contagem_invertida') %}
    <small class="hint pergunta-invertida">SIM = condição favorável (não soma risco). NÃO soma na contagem.</small>
    {% endif %}
  </div>
  <div class="sim-nao-buttons">
    <label class="sim-nao-btn">
      <input type="radio" name="{{ pergunta.id }}" value="sim" required>
      <span>Sim</span>
    </label>
    <label class="sim-nao-btn">
      <input type="radio" name="{{ pergunta.id }}" value="nao" checked>
      <span>Não</span>
    </label>
  </div>
</div>
{% endmacro %}
