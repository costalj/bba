<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="theme-color" content="#1b4332">
  <title>Login — BBA</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body class="login-page">
  <main class="login-container">
    <div class="login-logo">
      <img src="img/logo-bba.png" alt="BBA">
      <h1>BBA</h1>
      <p>Batalhão de Bombeiros Ambiental</p>
    </div>

    <form id="form-login" class="login-form" novalidate>
      <label class="field">
        <span>CPF</span>
        <input type="text" name="cpf" id="cpf" required inputmode="numeric" placeholder="000.000.000-00" maxlength="14" autocomplete="username" pattern="\d{3}\.\d{3}\.\d{3}-\d{2}" title="Informe os 11 dígitos do CPF">
      </label>
      <label class="field">
        <span>Senha</span>
        <input type="password" name="senha" required placeholder="Sua senha">
      </label>
      <p id="login-erro" class="login-erro hidden"></p>
      <button type="submit" class="btn btn-primary btn-block">Entrar</button>
    </form>

    <p class="login-hint">Desenvolvido pela MSR Tecnologia e Soluções LTDA</p>
  </main>

  <script src="js/usuarios-seed.js"></script>
  <script src="js/seed-meta.js"></script>
  <script src="js/seed.js"></script>
  <script src="js/sync-meta.js"></script>
  <script src="js/auth.js"></script>
  <script>
    function aplicarMascaraCpf(input) {
      let v = String(input.value || "").replace(/\D/g, "").slice(0, 11);
      if (v.length > 9) v = v.replace(/(\d{3})(\d{3})(\d{3})(\d{0,2})/, "$1.$2.$3-$4");
      else if (v.length > 6) v = v.replace(/(\d{3})(\d{3})(\d{0,3})/, "$1.$2.$3");
      else if (v.length > 3) v = v.replace(/(\d{3})(\d{0,3})/, "$1.$2");
      input.value = v;
    }

    const cpfInput = document.getElementById("cpf");
    cpfInput.maxLength = 14;
    cpfInput.addEventListener("input", () => aplicarMascaraCpf(cpfInput));
    cpfInput.addEventListener("paste", (e) => {
      e.preventDefault();
      const text = (e.clipboardData || window.clipboardData).getData("text") || "";
      cpfInput.value = text;
      aplicarMascaraCpf(cpfInput);
    });
    cpfInput.addEventListener("beforeinput", (e) => {
      if (e.inputType !== "insertText" && e.inputType !== "insertCompositionText") return;
      const digitos = cpfInput.value.replace(/\D/g, "").length;
      const selecionado = (cpfInput.selectionEnd || 0) - (cpfInput.selectionStart || 0);
      const novos = String(e.data || "").replace(/\D/g, "").length;
      if (selecionado === 0 && digitos >= 11 && novos > 0) e.preventDefault();
    });

    (async () => {
      await initUsuariosPadrao();
      if (isLogado()) {
        location.href = "index.html";
        return;
      }

      document.getElementById("form-login").onsubmit = async (e) => {
        e.preventDefault();
        aplicarMascaraCpf(cpfInput);
        const digitos = cpfInput.value.replace(/\D/g, "");
        const erro = document.getElementById("login-erro");
        erro.classList.add("hidden");
        if (digitos.length !== 11) {
          erro.textContent = "Informe o CPF completo (11 dígitos).";
          erro.classList.remove("hidden");
          return;
        }

        const fd = new FormData(e.target);
        try {
          const res = await login(fd.get("cpf"), fd.get("senha"));
          if (!res.ok) {
            erro.textContent = res.erro;
            erro.classList.remove("hidden");
            return;
          }
          sessionStorage.setItem("bba_bem_vindo", "1");
          const next = new URLSearchParams(location.search).get("next");
          location.href = next || "index.html";
        } catch (err) {
          console.error(err);
          erro.textContent = "Erro ao entrar. Reinstale o app ou limpe os dados do BBA.";
          erro.classList.remove("hidden");
        }
      };
    })();
  </script>
</body>
</html>
