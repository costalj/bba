<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Perfil</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header class="app-header">
    <div class="header-inner">
      <a href="index.html" class="header-back">←</a>
      <span class="logo"><img src="img/logo-bba.png" alt="BBA"></span>
      <div class="header-titles"><h1>Perfil</h1></div>
    </div>
  </header>
  <main class="container" id="conteudo"></main>
  <nav class="bottom-nav">
    <a href="index.html" class="nav-item"><span class="nav-icon">🏠</span><span>Início</span></a>
    <a href="admin.html" class="nav-item" id="nav-admin" style="display:none"><span class="nav-icon">⚙️</span><span>Admin</span></a>
    <span class="nav-item nav-item-disabled" id="nav-menu-placeholder"><span class="nav-icon">⚙️</span><span>Menu</span></span>
    <a href="perfil.html" class="nav-item active"><span class="nav-icon">👤</span><span>Perfil</span></a>
  </nav>
  <script src="js/sync-meta.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/db.js"></script>
  <script src="js/db-viaturas.js"></script>
  <script src="js/viaturas-cadastro.js"></script>
  <script src="js/sync-config.js"></script>
  <script src="js/sync-fotos.js"></script>
  <script src="js/sync.js"></script>
  <script src="js/app-version.js"></script>
  <script src="js/update-config.js"></script>
  <script src="js/app-update.js"></script>
  <script src="js/header.js"></script>
  <script>
    if (!exigirLogin()) throw new Error("auth");
    const u = getUsuario();
    const el = document.getElementById("conteudo");
    const cfg = getSyncConfig();
    const last = getLastSyncStatus();

    if (isAdmin()) {
      document.getElementById("nav-admin").style.display = "";
      document.getElementById("nav-menu-placeholder").style.display = "none";
    }

    function formatarStatusSync(st) {
      if (!st) return "Nunca sincronizado.";
      if (!st.ok) return `Erro: ${st.erro}`;
      const quando = st.quando ? new Date(st.quando).toLocaleString("pt-BR") : "—";
      const fotos =
        st.fotos_pendentes > 0
          ? ` · ${st.fotos_pendentes} foto(s) pendente(s)`
          : "";
      return `OK · ${st.enviados || 0} enviados · ${st.recebidos || 0} recebidos${fotos} · ${quando}`;
    }

    el.innerHTML = `
      <section class="info-card perfil-card">
        <h3>Militar logado</h3>
        <dl class="detail-list">
          <dt>Nome</dt><dd>${u.nome}</dd>
          <dt>Matrícula</dt><dd>${u.matricula}</dd>
          <dt>CPF</dt><dd>${formatarCpf(u.cpf)}</dd>
          <dt>Posto</dt><dd>${u.posto}</dd>
          <dt>Perfil</dt><dd>${u.perfil}</dd>
        </dl>
      </section>
      <div id="update-perfil-wrap"></div>
      <section class="info-card sync-card">
        <h3>Sincronização na nuvem</h3>
        <p class="hint">Dados e fotos ficam no celular offline. Com internet, sincronizam com o Supabase.</p>
        <label class="field">
          <span>URL do Supabase</span>
          <input type="url" id="sync-url" placeholder="https://xxxx.supabase.co" value="${cfg.url || ""}">
        </label>
        <label class="field">
          <span>Chave anon (API)</span>
          <input type="password" id="sync-key" placeholder="eyJ..." value="${cfg.anonKey || ""}">
        </label>
        <p class="hint" id="sync-status">${navigator.onLine ? "Online" : "Offline"} · ${formatarStatusSync(last)}</p>
        <button type="button" id="btn-sync" class="btn btn-secondary btn-block">🔄 Sincronizar agora</button>
      </section>
      ${isAdmin() ? '<a href="admin.html" class="btn btn-secondary btn-block">⚙️ Administração de usuários</a>' : ""}
      <button type="button" id="btn-sair" class="btn btn-primary btn-block">Sair</button>`;

    document.getElementById("btn-sair").onclick = () => {
      if (confirm("Deseja sair da conta?")) logoutUsuario();
    };

    document.getElementById("btn-sync").onclick = async () => {
      const btn = document.getElementById("btn-sync");
      const statusEl = document.getElementById("sync-status");
      saveSyncConfig(
        document.getElementById("sync-url").value,
        document.getElementById("sync-key").value
      );
      btn.disabled = true;
      btn.textContent = "Sincronizando…";
      statusEl.textContent = "Sincronizando…";
      const result = await sincronizar();
      btn.disabled = false;
      btn.textContent = "🔄 Sincronizar agora";
      statusEl.textContent = `${navigator.onLine ? "Online" : "Offline"} · ${formatarStatusSync(result)}`;
      if (!result.ok) alert(result.erro || "Falha na sincronização.");
      else if (result.fotos_pendentes > 0) {
        alert(
          `Sync concluído, mas ${result.fotos_pendentes} foto(s) falharam. Tente sincronizar de novo.`
        );
      }
    };

    if (typeof verificarAtualizacao === "function" && typeof initSecaoAtualizacaoPerfil === "function") {
      verificarAtualizacao({ silencioso: true }).then((info) => {
        initSecaoAtualizacaoPerfil(document.getElementById("update-perfil-wrap"), info);
      });
    }
  </script>
</body>
</html>
