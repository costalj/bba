<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Administração</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header class="app-header">
    <div class="header-inner">
      <a href="index.html" class="header-back">←</a>
      <span class="logo"><img src="img/logo-bba.png" alt="BBA"></span>
      <div class="header-titles"><h1>Administração</h1></div>
    </div>
  </header>
  <main class="container">
    <section id="admin-hub">
      <section class="hero">
        <h2>Configurações</h2>
        <p>Selecione o cadastro que deseja administrar.</p>
      </section>
      <section class="card-grid">
        <button type="button" class="action-card primary admin-hub-card" data-painel="usuarios">
          <span class="card-icon">👥</span><strong>Usuários</strong><small>Cadastrar, editar e desativar</small>
        </button>
        <button type="button" class="action-card admin-hub-card" data-painel="viaturas">
          <span class="card-icon">🚒</span><strong>Viaturas</strong><small>Cadastrar, editar e excluir</small>
        </button>
      </section>
    </section>

    <div id="painel-usuarios" class="admin-painel hidden">
    <button type="button" class="btn btn-secondary btn-voltar-admin">← Voltar às configurações</button>
    <section class="form-section">
      <h3>Cadastrar usuário</h3>
      <form id="form-usuario">
        <label class="field"><span>Nome *</span><input name="nome" required placeholder="Nome completo"></label>
        <label class="field"><span>Nome de Guerra *</span><input name="nome_guerra" required placeholder="Como aparece no app"></label>
        <label class="field"><span>Matrícula *</span><input name="matricula" required placeholder="Ex: 12345"></label>
        <label class="field"><span>CPF *</span><input name="cpf" id="cpf" required inputmode="numeric" placeholder="000.000.000-00" maxlength="14"></label>
        <label class="field"><span>Posto / Graduação *</span>
          <select name="posto" id="select-posto" required></select></label>
        <label class="field"><span>Perfil de acesso *</span>
          <select name="perfil" id="select-perfil" required></select></label>
        <label class="field"><span>Senha inicial *</span><input type="password" name="senha" required minlength="4" placeholder="Mínimo 4 caracteres"></label>
        <p id="form-erro" class="login-erro hidden"></p>
        <button type="submit" class="btn btn-primary btn-block">Cadastrar</button>
      </form>
    </section>

    <section class="info-card">
      <h3>Usuários cadastrados</h3>
      <ul id="lista-usuarios" class="usuarios-lista"></ul>
    </section>
    </div>

    <div id="painel-viaturas" class="admin-painel hidden">
    <button type="button" class="btn btn-secondary btn-voltar-admin">← Voltar às configurações</button>
    <section class="form-section">
      <h3>Cadastrar viatura</h3>
      <form id="form-viatura-cadastro">
        <label class="field"><span>AR *</span><input name="ar" required placeholder="Ex: AR 87" maxlength="20"></label>
        <label class="field"><span>Placa *</span><input name="placa" required placeholder="ABC1D23" maxlength="8" autocapitalize="characters"></label>
        <label class="field"><span>Marca *</span><input name="marca" required placeholder="Ex: Toyota"></label>
        <label class="field"><span>Modelo *</span><input name="modelo" required placeholder="Ex: Hilux"></label>
        <p id="viatura-erro" class="login-erro hidden"></p>
        <button type="submit" class="btn btn-primary btn-block">Cadastrar viatura</button>
      </form>
    </section>

    <section class="info-card">
      <h3>Viaturas cadastradas</h3>
      <ul id="lista-viaturas-cadastradas" class="usuarios-lista"></ul>
    </section>
    </div>

    <div id="modal-editar-usuario" class="modal-overlay hidden" role="dialog" aria-modal="true">
      <div class="modal-card">
        <h3>Editar usuário</h3>
        <form id="form-editar-usuario">
          <input type="hidden" name="user_id" id="edit-user-id">
          <label class="field"><span>Nome *</span><input name="nome" id="edit-nome" required></label>
          <label class="field"><span>Nome de Guerra *</span><input name="nome_guerra" id="edit-nome-guerra" required></label>
          <label class="field"><span>Matrícula *</span><input name="matricula" id="edit-matricula" required></label>
          <label class="field"><span>CPF *</span><input name="cpf" id="edit-cpf" required inputmode="numeric" placeholder="000.000.000-00" maxlength="14"></label>
          <label class="field"><span>Posto / Graduação *</span>
            <select name="posto" id="edit-posto" required></select></label>
          <label class="field"><span>Perfil de acesso *</span>
            <select name="perfil" id="edit-perfil" required></select></label>
          <p id="edit-erro" class="login-erro hidden"></p>
          <div class="modal-acoes">
            <button type="button" class="btn btn-secondary" id="btn-cancelar-edicao">Cancelar</button>
            <button type="submit" class="btn btn-primary">Salvar</button>
          </div>
        </form>
      </div>
    </div>

    <div id="modal-editar-viatura" class="modal-overlay hidden" role="dialog" aria-modal="true">
      <div class="modal-card">
        <h3>Editar viatura</h3>
        <form id="form-editar-viatura">
          <input type="hidden" name="viatura_id" id="edit-viatura-id">
          <label class="field"><span>AR *</span><input name="ar" id="edit-ar" required maxlength="20"></label>
          <label class="field"><span>Placa *</span><input name="placa" id="edit-placa" required maxlength="8"></label>
          <label class="field"><span>Marca *</span><input name="marca" id="edit-marca" required></label>
          <label class="field"><span>Modelo *</span><input name="modelo" id="edit-modelo" required></label>
          <p id="edit-viatura-erro" class="login-erro hidden"></p>
          <div class="modal-acoes">
            <button type="button" class="btn btn-secondary" id="btn-cancelar-viatura">Cancelar</button>
            <button type="submit" class="btn btn-primary">Salvar</button>
          </div>
        </form>
      </div>
    </div>
  </main>
  <nav class="bottom-nav">
    <a href="index.html" class="nav-item"><span class="nav-icon">🏠</span><span>Início</span></a>
    <a href="admin.html" class="nav-item active"><span class="nav-icon">⚙️</span><span>Admin</span></a>
    <a href="perfil.html" class="nav-item"><span class="nav-icon">👤</span><span>Perfil</span></a>
  </nav>
  <script src="js/sync-meta.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/viaturas-cadastro.js"></script>
  <script src="js/header.js"></script>
  <script src="admin.js"></script>
</body>
</html>
